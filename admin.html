<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060E">
    <title>Admin Dashboard | Muhammad Hassan</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2305060E'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='56' font-weight='800' text-anchor='middle' fill='%2300F5FF'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        .admin-body { display: flex; min-height: 100vh; background-color: var(--bg-dark); }
        
        .login-screen {
            position: fixed; inset: 0; background: rgba(5, 6, 14, 0.95);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box {
            background: var(--bg-dark-surface); border: 1px solid var(--bg-dark-border);
            padding: 3rem; border-radius: var(--radius-lg); max-width: 400px; width: 90%;
            text-align: center; box-shadow: var(--shadow-lg);
        }
        .login-box h2 { color: var(--neon-cyan); margin-bottom: 1rem; }
        .login-box p { color: var(--text-dark-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .login-box input {
            width: 100%; padding: 1rem; background: rgba(0,0,0,0.3);
            border: 1px solid var(--bg-dark-border); border-radius: var(--radius-sm);
            color: #fff; margin-bottom: 1.5rem; font-family: var(--font-mono);
        }
        .login-box input:focus { border-color: var(--neon-cyan); outline: none; }

        .admin-sidebar {
            width: 260px; background: var(--bg-dark-surface); border-right: 1px solid var(--bg-dark-border);
            padding: 2rem 1rem; display: flex; flex-direction: column;
        }
        .admin-sidebar h2 { color: #fff; font-size: 1.2rem; margin-bottom: 2rem; text-align: center; }
        .admin-nav { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .admin-nav button {
            width: 100%; text-align: left; padding: 1rem; background: transparent; border: none;
            color: var(--text-dark-muted); font-weight: 600; border-radius: var(--radius-sm);
            cursor: pointer; transition: all 0.3s;
        }
        .admin-nav button:hover, .admin-nav button.active {
            background: rgba(0, 245, 255, 0.1); color: var(--neon-cyan);
        }

        .admin-main { flex: 1; padding: 2rem; overflow-y: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .admin-header h1 { color: #fff; font-size: 1.8rem; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeSlideUp 0.3s var(--ease-out); }

        .admin-form { background: var(--bg-dark-surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--bg-dark-border); }
        .admin-form h3 { color: #fff; margin-bottom: 1.5rem; border-bottom: 1px solid var(--bg-dark-border); padding-bottom: 0.5rem; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; color: var(--neon-cyan); font-size: 0.85rem; margin-bottom: 0.5rem; font-family: var(--font-mono); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2);
            border: 1px solid var(--bg-dark-border); border-radius: var(--radius-sm);
            color: #fff; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--neon-cyan); outline: none; }
    </style>
</head>
<body class="theme-dark admin-body">

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>Admin Access</h2>
            <p>Enter your GitHub Personal Access Token to manage content.</p>
            <div style="position: relative; margin-bottom: 1.5rem;">
                <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="margin-bottom: 0; padding-right: 45px;">
                <button type="button" onclick="togglePassword()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--neon-cyan); cursor: pointer;">👁️</button>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">Login to Dashboard</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display: none; width: 100%; display: flex;">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <h2>M. Hassan Admin</h2>
            <ul class="admin-nav">
                <button class="active" onclick="switchTab('projects', this)">📁 Projects</button>
                <button onclick="switchTab('certificates', this)">📜 Certificates</button>
                <button onclick="switchTab('education', this)">🎓 Education</button>
            </ul>
            <div style="margin-top: auto; padding-top: 2rem;">
                <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem;" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            
            <!-- PROJECTS TAB -->
            <div id="tab-projects" class="tab-content active">
                <div class="admin-header">
                    <h1>Manage Projects</h1>
                    <button class="btn btn-primary" onclick="alert('Projects ka form agle step me aayega!')">+ Add New Project</button>
                </div>
                <div class="admin-form">
                    <h3>Project List</h3>
                    <div id="admin-projects-list"></div>
                </div>
            </div>

            <!-- CERTIFICATES TAB -->
            <div id="tab-certificates" class="tab-content">
                <div class="admin-header">
                    <h1>Manage Certificates</h1>
                    <button class="btn btn-primary" onclick="openCertForm()">+ Add Certificate</button>
                </div>
                <div class="admin-form">
                    <h3>Certificate List</h3>
                    <div id="admin-certs-list"></div>
                </div>
            </div>

            <!-- EDUCATION TAB -->
            <div id="tab-education" class="tab-content">
                <div class="admin-header">
                    <h1>Manage Education</h1>
                    <button class="btn btn-primary" onclick="openEduForm()">+ Add Education</button>
                </div>
                <div class="admin-form">
                    <h3>Education Timeline</h3>
                    <div id="admin-edu-list"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- EDUCATION FORM MODAL -->
    <div id="edu-form-modal" style="display: none; position: fixed; inset: 0; background: rgba(5,6,14,0.8); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: var(--bg-dark-surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--bg-dark-border); width: 90%; max-width: 500px;">
            <h3 id="edu-form-title" style="color: #fff; margin-bottom: 1.5rem;">Add New Education</h3>
            <input type="hidden" id="edu-index" value="-1">
            <div class="form-group"><label>Degree / Level</label><input type="text" id="edu-degree" placeholder="e.g. Bachelor of Science"></div>
            <div class="form-group"><label>Institution</label><input type="text" id="edu-institution" placeholder="e.g. Emerson University"></div>
            <div class="form-group"><label>Period (Years)</label><input type="text" id="edu-period" placeholder="e.g. 2023 - Present"></div>
            <div class="form-group"><label>Detail (Marks / CGPA)</label><input type="text" id="edu-detail" placeholder="e.g. CGPA: 3.53 / 4.00"></div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveEduForm()">Save Education</button>
                <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('edu-form-modal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <!-- CERTIFICATE FORM MODAL -->
    <div id="cert-form-modal" style="display: none; position: fixed; inset: 0; background: rgba(5,6,14,0.8); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: var(--bg-dark-surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--bg-dark-border); width: 90%; max-width: 500px;">
            <h3 id="cert-form-title" style="color: #fff; margin-bottom: 1.5rem;">Add New Certificate</h3>
            <input type="hidden" id="cert-index" value="-1">
            <div class="form-group"><label>Certificate Title</label><input type="text" id="cert-title" placeholder="e.g. Hello, Python!"></div>
            <div class="form-group"><label>Issuer (Organization)</label><input type="text" id="cert-issuer" placeholder="e.g. Google via Coursera"></div>
            <div class="form-group"><label>Date</label><input type="text" id="cert-date" placeholder="e.g. 9 Sep, 2026"></div>
            <div class="form-group"><label>PDF File Path</label><input type="text" id="cert-file" placeholder="e.g. assets/documents/certificates/file.pdf"></div>
            <div class="form-group"><label>Verify URL (Optional)</label><input type="text" id="cert-verify" placeholder="https://..."></div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveCertForm()">Save Certificate</button>
                <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('cert-form-modal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('tokenInput');
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
    <script src="js/admin.js"></script>
</body>
</html>
