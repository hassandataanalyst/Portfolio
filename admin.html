<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060E">
    <title>Admin Dashboard | Muhammad Hassan</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2305060E'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='56' font-weight='800' text-anchor='middle' fill='%2300F5FF'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        .admin-body { display: flex; min-height: 100vh; background-color: var(--bg-dark); }
        .login-screen { position: fixed; inset: 0; background: rgba(5, 6, 14, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: var(--bg-dark-surface); border: 1px solid var(--bg-dark-border); padding: 3rem; border-radius: var(--radius-lg); max-width: 400px; width: 90%; text-align: center; box-shadow: var(--shadow-lg); }
        .login-box h2 { color: var(--neon-cyan); margin-bottom: 1rem; }
        .login-box p { color: var(--text-dark-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .login-box input { width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid var(--bg-dark-border); border-radius: var(--radius-sm); color: #fff; margin-bottom: 1.5rem; font-family: var(--font-mono); }
        .login-box input:focus { border-color: var(--neon-cyan); outline: none; }
        .admin-sidebar { width: 260px; background: var(--bg-dark-surface); border-right: 1px solid var(--bg-dark-border); padding: 2rem 1rem; display: flex; flex-direction: column; }
        .admin-sidebar h2 { color: #fff; font-size: 1.2rem; margin-bottom: 2rem; text-align: center; }
        .admin-nav { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .admin-nav button { width: 100%; text-align: left; padding: 1rem; background: transparent; border: none; color: var(--text-dark-muted); font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.3s; }
        .admin-nav button:hover, .admin-nav button.active { background: rgba(0, 245, 255, 0.1); color: var(--neon-cyan); }
        .admin-main { flex: 1; padding: 2rem; overflow-y: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .admin-header h1 { color: #fff; font-size: 1.8rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeSlideUp 0.3s var(--ease-out); }
        .admin-form { background: var(--bg-dark-surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--bg-dark-border); }
        .admin-form h3 { color: #fff; margin-bottom: 1.5rem; border-bottom: 1px solid var(--bg-dark-border); padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; color: var(--neon-cyan); font-size: 0.85rem; margin-bottom: 0.5rem; font-family: var(--font-mono); }
        .form-group input, .form-group textarea { width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid var(--bg-dark-border); border-radius: var(--radius-sm); color: #fff; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--neon-cyan); outline: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(5,6,14,0.8); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: var(--bg-dark-surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--bg-dark-border); width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body class="theme-dark admin-body">

    <!-- LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>Admin Access</h2>
            <p>Enter your GitHub Personal Access Token.</p>
            <div style="position: relative; margin-bottom: 1.5rem;">
                <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="margin-bottom: 0; padding-right: 45px;">
                <button type="button" onclick="document.getElementById('tokenInput').type = document.getElementById('tokenInput').type === 'password' ? 'text' : 'password'" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--neon-cyan); cursor: pointer;">👁️</button>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">Login</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display: none; width: 100%; display: flex;">
        <aside class="admin-sidebar">
            <h2>M. Hassan Admin</h2>
            <ul class="admin-nav">
                <button class="active" onclick="switchTab('projects', this)">📁 Projects</button>
                <button onclick="switchTab('certificates', this)">📜 Certificates</button>
                <button onclick="switchTab('education', this)">🎓 Education</button>
                <button onclick="switchTab('stats', this)">📊 Hero Stats</button> <!-- NEW TAB -->
            </ul>
            <div style="margin-top: auto; padding-top: 2rem;">
                <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem;" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="admin-main">
            <!-- PROJECTS TAB -->
            <div id="tab-projects" class="tab-content active">
                <div class="admin-header">
                    <h1>Manage Projects</h1>
                    <button class="btn btn-primary" onclick="openProjectForm()">+ Add Project</button>
                </div>
                <div class="admin-form"><h3>Project List</h3><div id="admin-projects-list"></div></div>
            </div>

            <!-- CERTIFICATES TAB -->
            <div id="tab-certificates" class="tab-content">
                <div class="admin-header">
                    <h1>Manage Certificates</h1>
                    <button class="btn btn-primary" onclick="openCertForm()">+ Add Certificate</button>
                </div>
                <div class="admin-form"><h3>Certificate List</h3><div id="admin-certs-list"></div></div>
            </div>

            <!-- EDUCATION TAB -->
            <div id="tab-education" class="tab-content">
                <div class="admin-header">
                    <h1>Manage Education</h1>
                    <button class="btn btn-primary" onclick="openEduForm()">+ Add Education</button>
                </div>
                <div class="admin-form"><h3>Education Timeline</h3><div id="admin-edu-list"></div></div>
            </div>

            <!-- NEW: STATS TAB -->
            <div id="tab-stats" class="tab-content">
                <div class="admin-header">
                    <h1>Manage Hero Stats</h1>
                </div>
                <div class="admin-form">
                    <h3>Homepage CGPA</h3>
                    <div class="form-group">
                        <label>CGPA Value (e.g. 3.53)</label>
                        <input type="text" id="stat-cgpa" placeholder="3.53">
                    </div>
                    <div class="form-group">
                        <label>Total CGPA (e.g. 4.00)</label>
                        <input type="text" id="stat-cgpa-total" placeholder="4.00">
                    </div>
                    <button class="btn btn-primary" onclick="saveStatsForm()" style="margin-top: 1rem;">Save Stats</button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODALS -->
    <!-- Project Form -->
    <div id="project-form-modal" class="modal">
        <div class="modal-content">
            <h3 id="project-form-title" style="color: #fff; margin-bottom: 1.5rem;">Add Project</h3>
            <input type="hidden" id="project-index" value="-1">
            <div class="form-group"><label>Title</label><input type="text" id="proj-title"></div>
            <div class="form-group"><label>Category</label><input type="text" id="proj-category"></div>
            <div class="form-group"><label>Short Description</label><input type="text" id="proj-desc"></div>
            <div class="form-group"><label>Technologies (comma separated)</label><input type="text" id="proj-tech"></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="proj-img"></div>
            <div class="form-group"><label>Featured? (true/false)</label><input type="text" id="proj-featured"></div>
            <div id="dynamic-sections-container"></div>
            <button class="btn btn-outline" style="margin-bottom: 1.5rem;" onclick="addProjectSection()">+ Add Section (Heading & Desc)</button>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveProjectForm()">Save Project</button>
                <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('project-form-modal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Certificate Form -->
    <div id="cert-form-modal" class="modal">
        <div class="modal-content">
            <h3 id="cert-form-title" style="color: #fff; margin-bottom: 1.5rem;">Add Certificate</h3>
            <input type="hidden" id="cert-index" value="-1">
            <div class="form-group"><label>Title</label><input type="text" id="cert-title"></div>
            <div class="form-group"><label>Issuer</label><input type="text" id="cert-issuer"></div>
            <div class="form-group"><label>Date</label><input type="text" id="cert-date"></div>
            <div class="form-group"><label>File Path</label><input type="text" id="cert-file"></div>
            <div class="form-group"><label>Verify URL</label><input type="text" id="cert-verify"></div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveCertForm()">Save Certificate</button>
                <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('cert-form-modal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Education Form -->
    <div id="edu-form-modal" class="modal">
        <div class="modal-content">
            <h3 id="edu-form-title" style="color: #fff; margin-bottom: 1.5rem;">Add Education</h3>
            <input type="hidden" id="edu-index" value="-1">
            <div class="form-group"><label>Degree</label><input type="text" id="edu-degree"></div>
            <div class="form-group"><label>Institution</label><input type="text" id="edu-institution"></div>
            <div class="form-group"><label>Period</label><input type="text" id="edu-period"></div>
            <div class="form-group"><label>Detail</label><input type="text" id="edu-detail"></div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveEduForm()">Save Education</button>
                <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('edu-form-modal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
